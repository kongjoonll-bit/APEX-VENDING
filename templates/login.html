<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX VENDING · ADMIN LOGIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #F0B429;
            --mint: #3DDC97;
            --coral: #FF5C6C;
            --text: #E9EEF7;
            --muted: #8B96A8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background:
                radial-gradient(900px 480px at 12% -10%, rgba(240,180,41,0.20), transparent 60%),
                radial-gradient(760px 420px at 106% 8%, rgba(61,220,151,0.14), transparent 58%),
                linear-gradient(165deg, #080B11 0%, #121A28 60%, #0A0F17 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: var(--text);
        }
        .login-box {
            width: 100%;
            max-width: 400px;
            background: rgba(21, 27, 38, 0.92);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 22px;
            padding: 42px 36px 36px;
            box-shadow: 0 28px 70px rgba(0,0,0,0.55);
            position: relative;
            overflow: hidden;
        }
        .login-box::before {
            content: '';
            position: absolute;
            inset: 0 0 auto 0;
            height: 3px;
            background: linear-gradient(90deg, var(--gold), var(--mint));
        }
        .mark {
            width: 64px;
            height: 64px;
            margin: 0 auto 18px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            background: linear-gradient(160deg, rgba(240,180,41,0.22), rgba(240,180,41,0.04));
            border: 1px solid rgba(240,180,41,0.35);
            box-shadow: 0 0 26px rgba(240,180,41,0.25);
        }
        .login-box h1 {
            text-align: center;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #FFD177;
        }
        .subtle {
            text-align: center;
            color: var(--muted);
            margin: 8px 0 28px;
            font-size: 11px;
            letter-spacing: 3px;
        }
        .login-box input {
            width: 100%;
            padding: 15px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 12px;
            font-size: 15px;
            color: var(--text);
            margin-bottom: 18px;
            transition: border-color 0.25s, box-shadow 0.25s;
            font-family: 'Noto Sans KR', sans-serif;
        }
        .login-box input::placeholder { color: #667287; }
        .login-box input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(240,180,41,0.18);
        }
        .login-box button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #FFD177 0%, #F0B429 55%, #D89E1B 100%);
            color: #14181F;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 1px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: 'Noto Sans KR', sans-serif;
        }
        .login-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(240,180,41,0.28);
        }
        .error {
            background: rgba(255,92,108,0.12);
            border: 1px solid rgba(255,92,108,0.35);
            color: #FF9AA4;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 18px;
            text-align: center;
            font-size: 13px;
            font-weight: 700;
        }
        .foot {
            text-align: center;
            margin-top: 22px;
            font-size: 10px;
            letter-spacing: 2px;
            color: #5A6478;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="mark">A</div>
        <h1>APEX VENDING</h1>
        <p class="subtle">ADMIN CONSOLE</p>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <input type="password" name="password" placeholder="관리자 비밀번호" required autofocus>
            <button type="submit">LOGIN</button>
        </form>
        <div class="foot">PREMIUM DIGITAL KEY STORE · 24/7</div>
    </div>
</body>
</html>
