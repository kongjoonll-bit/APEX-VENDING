services:
  - type: web
    name: apex-vending
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 --graceful-timeout 30 --access-logfile - --error-logfile -
    autoDeploy: true
    envVars:
      - key: PORT
        value: "10000"
      - key: DISCORD_TOKEN
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEPOSIT_WEBHOOK_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0

